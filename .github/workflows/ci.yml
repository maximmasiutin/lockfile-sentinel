# SPDX-License-Identifier: GPL-3.0-only
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every version the README names. It advertises 3.12 or newer, so a
        # release after the last entry here is claimed and untested, which the
        # README states rather than leaving this list to imply otherwise.
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q

      - name: Static analysis
        # These three commands must match the README's argument for argument.
        # It states what each of them covers, and this step is the only thing
        # keeping those sentences true.
        #
        # pylint reads the tests as well, and the directory is passed recursively
        # rather than as a file list so that a test added later is covered
        # without anybody remembering to add it here. It is passed alongside the
        # programs rather than on its own because that puts both directories on
        # the path, which is what lets the tests import what they are testing.
        #
        # --python-version is pinned to the floor rather than following the
        # matrix on purpose: it asks whether the code is valid on the oldest
        # interpreter the README claims, and the matrix answers the newer ones.
        run: |
          python -m pip install --upgrade mypy pylint bandit
          python -m mypy --python-version 3.12 lockfile_sentinel.py update_scanners.py schedule_tasks.py bump_version.py
          python -m pylint lockfile_sentinel.py update_scanners.py schedule_tasks.py bump_version.py --recursive=y tests
          python -m bandit -r . -x ./tests

      - name: Offline self-test
        # Without osv-scanner on PATH the self-test exercises the offline layer
        # and reports that the live one was not tested, which is exit 2 rather
        # than a pass. The job below installs the scanner and tests both.
        run: python lockfile_sentinel.py --selftest || test $? -eq 2
        shell: bash

  selftest:
    # The positive control, and the only check that proves the detector still
    # detects rather than that the code still parses. A scanner reporting
    # nothing is indistinguishable from a broken one without it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/
          osv-scanner --version

      - name: Self-test, both layers
        run: python lockfile_sentinel.py --selftest

  ci-passed:
    # One context to require in branch protection, so that the list of required
    # checks does not have to be re-edited whenever the matrix changes. Requiring
    # the matrix jobs by name is the alternative, and it fails in a way that is
    # hard to diagnose: a required context that no longer reports blocks every
    # merge and gives no reason on the pull request.
    #
    # if: always() so this runs even when a dependency failed; without it the job
    # would be skipped, and a skipped required check never turns red, which is
    # the shape of gate that reports success by not running.
    if: always()
    needs: [test, selftest]
    runs-on: ubuntu-latest
    steps:
      - name: Report whether every job passed
        run: |
          echo "test:     ${{ needs.test.result }}"
          echo "selftest: ${{ needs.selftest.result }}"
          # Anything other than success fails this job, so cancelled and skipped
          # count against it too rather than passing by not being a failure.
          test "${{ needs.test.result }}" = success || exit 1
          test "${{ needs.selftest.result }}" = success || exit 1
